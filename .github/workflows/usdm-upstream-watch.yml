name: usdm-upstream-watch

# Watches the canonical USDM-RDF we adopt (github.com/kerfors/usdm-rdf, ADR-0029)
# and, when a new release appears, produces an ABSORB/REVIEW assessment. The job goes
# RED only when there is a new upstream release to look at — that is the signal, not a
# broken build. The assessment (version delta, class diff, and the decision-critical
# crosswalk-impact) is written to the run's Step Summary and uploaded as an artifact.

on:
  schedule:
    - cron: '17 6 * * 1'     # Mondays 06:17 UTC
  workflow_dispatch:          # and on demand
    inputs:
      ref:
        description: 'upstream git ref to assess (default: pinned branch / main)'
        required: false
        default: ''

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install rdflib
      - name: Assess kerfors/usdm-rdf latest vs our pin
        run: |
          python3 cr-domain/tools/usdm-rdf-gen/check_upstream.py \
            ${{ inputs.ref && format('--ref {0}', inputs.ref) || '' }} \
            --report usdm-assessment.md
      - name: Publish assessment to the run summary
        if: always()
        run: cat usdm-assessment.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload assessment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdm-upstream-assessment
          path: usdm-assessment.md
          if-no-files-found: ignore
